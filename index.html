<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Initiative Stability Index (ISI) — V0</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 40px;
    color: #1a1a1a;
}

h1, h2 {
    font-weight: 600;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 40px;
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

.section {
    margin-bottom: 40px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: 500;
}

input[type=number] {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
}

button {
    margin-top: 20px;
    padding: 10px 20px;
    border: none;
    background: #1a1a1a;
    color: white;
    cursor: pointer;
}

button.secondary {
    background: #666;
}

.result-box {
    padding: 20px;
    margin-top: 20px;
    background: #f0f2f5;
    border-radius: 6px;
}

.band {
    font-size: 20px;
    font-weight: 600;
}

.small {
    font-size: 13px;
    color: #555;
}
</style>
</head>

<body>
<div class="container">

<h1>Initiative Stability Index (ISI)</h1>
<p class="small">Quarterly Stability Instrument — V0 Prototype</p>

<div class="section">
<label>Initiative Name</label>
<input type="text" id="initiativeName" placeholder="Enter initiative name" />
</div>

<div class="section">
<h2>Vector Scoring (0–100)</h2>

<label>Engagement</label>
<input type="number" id="engagement" min="0" max="100" />

<label>Decision Latency</label>
<input type="number" id="decision" min="0" max="100" />

<label>Leadership Signal Coherence</label>
<input type="number" id="leadership" min="0" max="100" />

<label>Delivery Readiness</label>
<input type="number" id="readiness" min="0" max="100" />

<label>Governance Friction</label>
<input type="number" id="governance" min="0" max="100" />

<label>Execution Fatigue</label>
<input type="number" id="fatigue" min="0" max="100" />

<button onclick="calculateISI()">Run Interim Diagnostic (Non-Recorded)</button>
<button onclick="recordPulse()">Submit Official Quarterly Pulse</button>

<div id="results" class="result-box" style="display:none;"></div>
</div>

<div class="section">
<h2>Pulse History</h2>
<div id="history"></div>
</div>

</div>

<script>

const weights = {
    engagement: 1,
    decision: 1,
    leadership: 1,
    readiness: 1,
    governance: 1,
    fatigue: 1
};

function getScores() {
    return {
        engagement: parseFloat(document.getElementById("engagement").value),
        decision: parseFloat(document.getElementById("decision").value),
        leadership: parseFloat(document.getElementById("leadership").value),
        readiness: parseFloat(document.getElementById("readiness").value),
        governance: parseFloat(document.getElementById("governance").value),
        fatigue: parseFloat(document.getElementById("fatigue").value)
    };
}

function computeComposite(scores) {
    let total = 0;
    let weightSum = 0;

    for (let key in scores) {
        total += scores[key] * weights[key];
        weightSum += weights[key];
    }

    return Math.round(total / weightSum);
}

function classifyBand(score) {
    if (score >= 80) return "Stable";
    if (score >= 70) return "Monitoring";
    if (score >= 60) return "Pressured";
    return "At Risk";
}

function classifyTrend(history) {
    if (history.length < 2) return "Insufficient Data";

    const last = history[history.length - 1].score;
    const prev = history[history.length - 2].score;

    const delta = last - prev;

    if (Math.abs(delta) > 15) return "Volatile";
    if (delta > 0) return "Stabilizing";
    if (delta < 0) return "Degrading";
    return "Stable";
}

function detectVolatility(history) {
    if (history.length < 2) return false;

    const last = history[history.length - 1].score;
    const prev = history[history.length - 2].score;

    const percentChange = Math.abs((last - prev) / prev) * 100;
    return percentChange > 15;
}

function calculateISI() {
    const scores = getScores();
    const composite = computeComposite(scores);
    const band = classifyBand(composite);

    document.getElementById("results").style.display = "block";
    document.getElementById("results").innerHTML = `
        <div class="band">ISI: ${composite} — ${band}</div>
        <p>Interim diagnostic complete. This pulse is not recorded.</p>
    `;
}

function recordPulse() {
    const name = document.getElementById("initiativeName").value;
    if (!name) {
        alert("Enter initiative name.");
        return;
    }

    const scores = getScores();
    const composite = computeComposite(scores);
    const band = classifyBand(composite);

    let history = JSON.parse(localStorage.getItem(name)) || [];
    history.push({
        date: new Date().toLocaleDateString(),
        score: composite,
        band: band
    });

    localStorage.setItem(name, JSON.stringify(history));

    const trend = classifyTrend(history);
    const volatile = detectVolatility(history);

    document.getElementById("results").style.display = "block";
    document.getElementById("results").innerHTML = `
        <div class="band">ISI: ${composite} — ${band}</div>
        <p>Stability Trajectory: ${trend}</p>
        ${volatile ? "<p><strong>Volatile Trend Detected</strong></p>" : ""}
        <p>Official Quarterly Pulse recorded.</p>
    `;

    renderHistory(name);
}

function renderHistory(name) {
    const history = JSON.parse(localStorage.getItem(name)) || [];
    let html = "";

    history.forEach(pulse => {
        html += `
            <div class="result-box">
                <strong>${pulse.date}</strong><br/>
                ISI: ${pulse.score} — ${pulse.band}
            </div>
        `;
    });

    document.getElementById("history").innerHTML = html;
}

</script>
</body>
</html>
