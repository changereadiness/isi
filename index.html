<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Initiative Stability Index (ISI)</title>

<style>
body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f9; display: flex; }
.main { flex: 3; margin-right: 40px; }
.side { flex: 1; background: white; padding: 20px; border-radius: 6px; height: fit-content; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
.vector { background: white; padding: 20px; margin-bottom: 25px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.05);}
.question { margin-bottom: 12px; }
textarea { width: 100%; height: 40px; }
input[type="number"] { width: 60px; }
.scale { font-size: 12px; color: #666; display: none; margin-top: 5px; }
.heat-box { width: 100%; height: 8px; border-radius: 4px; margin-top: 8px; background: #ddd; }
.overall { background: #e6ebf2; padding: 20px; font-size: 18px; border-radius: 6px; margin-top: 20px; }
.alert { color: #b30000; font-weight: bold; margin-top: 10px; }
button { margin-top: 10px; }
@media print {
.side, button { display: none; }
body { margin: 0; }
}
</style>
</head>
<body>

<div class="main">

<h1>Initiative Stability Index (ISI)</h1>

<label><strong>Initiative Name:</strong></label><br>
<input type="text" id="initiativeName"><br><br>

<div id="vectors"></div>

<div class="overall">
Overall ISI Score: <span id="overallScore">0.00</span><br>
Stability Indicator: <span id="stabilityLabel">—</span>
<div id="volatilityAlert" class="alert"></div>
</div>

<button onclick="captureBaseline()">Capture Baseline (Quarter Snapshot)</button>
<button onclick="window.print()">Export to PDF</button>

</div>

<div class="side">
<h3>Vector Comparison</h3>
<div id="comparisonPanel"></div>
<div style="margin-top:20px;">
<strong>Baseline Timestamp:</strong>
<div id="baselineTime">None</div>
</div>
</div>

<script>

const scaleDefinition = `
5 = Stable / Strongly Reinforcing
4 = Mostly Stable / Minor Friction
3 = Emerging Instability
2 = Material Friction
1 = Structurally Unstable
`;

let baselineData = null;

const vectors = [ /* SAME 6 VECTORS + 30 QUESTIONS AS PREVIOUS VERSION */
{
name: "Strategic Alignment Integrity",
questions: [
"In the past 30 days, how consistently have executive sponsors articulated the same strategic rationale for this initiative?",
"How frequently have strategic decisions reinforced (rather than diluted) the initiative’s stated objectives?",
"To what extent are business unit priorities visibly aligned with this initiative?",
"How stable is the initiative’s scope compared to baseline definition?",
"How clearly can mid-level leaders articulate the “why” behind this initiative?"
]
},
{
name: "Leadership Reinforcement Consistency",
questions: [
"How frequently have primary sponsors referenced the initiative in formal forums over the last 30 days?",
"To what extent are leaders modeling the expected new behaviors?",
"How often is progress on the initiative reviewed in leadership meetings?",
"When resistance emerges, how consistently do leaders intervene to reinforce direction?",
"Have any senior leaders signaled ambiguity about commitment to the initiative?"
]
},
{
name: "Stakeholder & Power Friction",
questions: [
"Have key stakeholder groups experienced a loss of influence, control, or status due to this initiative?",
"How openly are concerns being surfaced by impacted groups?",
"Have any informal influencers expressed skepticism in the past 30 days?",
"To what extent are stakeholder incentives aligned with desired outcomes?",
"Are escalation channels being used constructively?"
]
},
{
name: "Capability & Capacity Sufficiency",
questions: [
"Over the past 30 days, how adequate has the dedicated capacity been for advancing this initiative?",
"To what extent do key delivery roles possess the required skills to execute their responsibilities?",
"How frequently are initiative team members diverted to competing priorities?",
"Is there clear ownership for all critical workstreams?",
"How sustainable is the current execution pace over the next 90 days?"
]
},
{
name: "Delivery Design Robustness",
questions: [
"How realistic are current milestone timelines relative to complexity?",
"To what extent are dependencies across workstreams actively managed?",
"How often are risks formally reviewed and mitigated?",
"How clearly defined are success criteria for the next 90 days?",
"If a key assumption fails, how prepared is the team to adapt?"
]
},
{
name: "Adoption Momentum",
questions: [
"To what extent are target users consistently applying the new processes or behaviors?",
"How frequently do teams revert to legacy practices?",
"Are adoption metrics (formal or informal) reviewed regularly?",
"How confident are frontline managers in coaching the new behaviors?",
"Is visible progress reinforcing continued adoption?"
]
}
];

const container = document.getElementById("vectors");

vectors.forEach((vector, vIndex) => {

let div = document.createElement("div");
div.className = "vector";

div.innerHTML = `<h2>Vector ${vIndex+1}: ${vector.name}</h2>`;

vector.questions.forEach((q, qIndex) => {
div.innerHTML += `
<div class="question">
<p>${q} <button onclick="toggleScale('scale${vIndex}${qIndex}')">Scale</button></p>
<input type="number" min="1" max="5" value="3"
onchange="calculateScores()"
id="v${vIndex}q${qIndex}">
<div class="scale" id="scale${vIndex}${qIndex}">
${scaleDefinition}
</div>
<textarea placeholder="Optional evidence"></textarea>
</div>
`;
});

div.innerHTML += `
<strong>Vector Score: <span id="vectorScore${vIndex}">0.00</span></strong>
<div class="heat-box" id="heat${vIndex}"></div>
`;

container.appendChild(div);

});

function toggleScale(id){
let el = document.getElementById(id);
el.style.display = el.style.display === "none" ? "block" : "none";
}

function calculateScores() {

let overallTotal = 0;
let vectorResults = [];

vectors.forEach((vector, vIndex) => {

let vectorTotal = 0;

vector.questions.forEach((q, qIndex) => {
let value = parseFloat(document.getElementById(`v${vIndex}q${qIndex}`).value) || 0;
vectorTotal += value;
});

let avg = vectorTotal / vector.questions.length;
vectorResults.push({ name: vector.name, score: avg });

document.getElementById(`vectorScore${vIndex}`).innerText = avg.toFixed(2);
document.getElementById(`heat${vIndex}`).style.background =
`rgba(0, 70, 140, ${avg/5})`;

overallTotal += avg;

});

let overallAvg = overallTotal / vectors.length;
document.getElementById("overallScore").innerText = overallAvg.toFixed(2);

let label = "Stable";
if (overallAvg < 3.5) label = "Pressured";
if (overallAvg < 2.5) label = "At Risk";

document.getElementById("stabilityLabel").innerText = label;

updateComparison(vectorResults);
checkVolatility(vectorResults);

}

function updateComparison(results) {
results.sort((a,b)=>b.score-a.score);
let panel = document.getElementById("comparisonPanel");
panel.innerHTML = "";
results.forEach(r=>{
panel.innerHTML += `<div>${r.name}: ${r.score.toFixed(2)}</div>`;
});
}

function captureBaseline() {
let scores = [];
vectors.forEach((v,i)=>{
scores.push(parseFloat(document.getElementById(`vectorScore${i}`).innerText));
});
baselineData = {
timestamp: new Date(),
scores: scores
};
document.getElementById("baselineTime").innerText = baselineData.timestamp.toLocaleString();
}

function checkVolatility(currentResults) {

if (!baselineData) return;

let alert = "";
currentResults.forEach((r,i)=>{
let baselineScore = baselineData.scores[i];
let drop = (baselineScore - r.score) / baselineScore;
if (drop > 0.10) {
alert = "Volatile Trend Detected";
}
});

document.getElementById("volatilityAlert").innerText = alert;

}

calculateScores();

</script>

</body>
</html>
